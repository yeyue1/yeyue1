<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Embedded Systems — Hardware meets software</title><desc id="desc">Animated embedded workbench with a processor, flowing circuit signals, terminal cursor and logic analyzer. Decorative waveforms are not live hardware measurements.</desc>
